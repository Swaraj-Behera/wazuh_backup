name: Deploy to WAZUHManager

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
  workflow_dispatch:  # Manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy daemon script via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.WAZUH_VM_IP }}
          username: ${{ secrets.WAZUH_VM_USER }}
          key: ${{ secrets.WAZUH_VM_SSH_KEY }}
          source: "scripts/wazuh-dr-daemon.sh"
          target: "/tmp/"

      - name: Install and restart daemon
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WAZUH_VM_IP }}
          username: ${{ secrets.WAZUH_VM_USER }}
          key: ${{ secrets.WAZUH_VM_SSH_KEY }}
          script: |
            set -e
            # Backup current version
            sudo cp /usr/local/bin/wazuh-dr-daemon.sh \
                    /root/wazuh-dr-daemon.sh.bak.$(date +%s) || true
            
            # Install new version
            sudo install -m 700 /tmp/wazuh-dr-daemon.sh \
                                /usr/local/bin/wazuh-dr-daemon.sh
            
            # Restart daemon
            sudo systemctl daemon-reload
            sudo systemctl restart wazuh-dr-daemon
            
            # Verify it's running
            sleep 3
            sudo systemctl is-active wazuh-dr-daemon
            
            # Cleanup
            rm -f /tmp/wazuh-dr-daemon.sh
