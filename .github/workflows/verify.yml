name: Verify Daily Backup

on:
  schedule:
    - cron: '0 6 * * *'   # 6 AM UTC daily (after 2 AM backup)
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check backup exists and is recent
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WAZUH_VM_IP }}
          username: ${{ secrets.WAZUH_VM_USER }}
          key: ${{ secrets.WAZUH_VM_SSH_KEY }}
          script: |
            set -e
            TODAY=$(date +%F)
            
            # Check today's backup exists
            if ! ls /var/backups/wazuh-dr/wazuh-config-${TODAY}-*.tar.gz.gpg 1>/dev/null 2>&1; then
              echo "❌ No backup found for $TODAY"
              exit 1
            fi
            
            # Verify checksum
            cd /var/backups/wazuh-dr
            for sum in *.sha256; do
              sha256sum -c "$sum" || exit 1
            done
            
            # Check daemon is running
            sudo systemctl is-active wazuh-dr-daemon
            
            # Check Wazuh services
            for svc in wazuh-manager wazuh-indexer wazuh-dashboard; do
              sudo systemctl is-active "$svc"
            done
            
            echo "✅ All checks passed"

      - name: Create GitHub Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Backup verification failed - ${new Date().toISOString().split('T')[0]}`,
              body: 'Automated backup verification failed. Check the WAZUHManager VM immediately.',
              labels: ['incident', 'backup']
            })
